<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SharpIQ — Panel Privado</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:     #07051A;
      --card:   #0d0b2a;
      --border: rgba(0,200,255,.15);
      --cyan:   #00C8FF;
      --purple: #7B5CF0;
      --green:  #22c55e;
      --red:    #ef4444;
      --t1:     #e2e8f0;
      --t2:     #94a3b8;
      --t3:     #475569;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--t1); font-family: 'Inter', sans-serif; min-height: 100vh; padding: 24px 16px 80px; }

    /* ── LOGIN ── */
    #screen-login {
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 24px;
    }
    .login-logo { font-family: 'Orbitron', monospace; font-size: 2rem; font-weight: 900; color: var(--cyan); letter-spacing: 4px; }
    .login-sub  { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--t3); letter-spacing: 2px; text-transform: uppercase; }
    .login-box  { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 32px 28px; width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 16px; }
    .login-box input {
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 14px 16px; color: var(--t1); font-size: 16px; outline: none; width: 100%;
      text-align: center; letter-spacing: 4px; font-family: 'Space Mono', monospace;
    }
    .login-box input:focus { border-color: var(--cyan); }
    .btn-grad {
      padding: 14px; border: none; border-radius: 10px; cursor: pointer;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      color: #fff; font-family: 'Orbitron', monospace; font-size: 12px;
      font-weight: 700; letter-spacing: 1px; transition: opacity .2s;
    }
    .btn-grad:hover { opacity: .85; }
    .login-err { color: var(--red); font-size: 13px; text-align: center; display: none; }

    /* ── SETUP TOKEN ── */
    #screen-setup { display: none; flex-direction: column; gap: 20px; max-width: 480px; margin: 0 auto; padding-top: 40px; }
    .setup-title { font-family: 'Orbitron', monospace; font-size: 1.1rem; color: var(--cyan); text-align: center; }
    .setup-note  { font-size: 13px; color: var(--t2); text-align: center; line-height: 1.6; }
    .field label { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--t3); display: block; margin-bottom: 6px; }
    .field input  { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; color: var(--t1); font-size: 14px; width: 100%; outline: none; }
    .field input:focus { border-color: var(--cyan); }

    /* ── MAIN PANEL ── */
    #screen-main { display: none; flex-direction: column; gap: 20px; max-width: 560px; margin: 0 auto; }

    .panel-header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .panel-logo   { font-family: 'Orbitron', monospace; font-size: 1rem; font-weight: 900; color: var(--cyan); letter-spacing: 3px; }
    .btn-logout   { font-size: 12px; color: var(--t3); background: none; border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; cursor: pointer; }

    .section-label { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--t3); margin-bottom: 10px; }

    /* Pred cards */
    .pred-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 16px 18px; display: flex; flex-direction: column; gap: 10px;
    }
    .pred-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
    .pred-partido { font-weight: 700; font-size: 14px; color: var(--t1); }
    .pred-liga    { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--t3); }
    .pred-hora    { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--cyan); }
    .pred-probs   { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--t2); }
    .pred-pick    { font-size: 13px; color: var(--t1); font-weight: 600; }
    .pred-ev      { font-size: 12px; }
    .ev-pos { color: var(--green); } .ev-neg { color: var(--red); } .ev-neu { color: var(--t3); }

    .pred-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .btn-vip, .btn-free, .btn-result {
      flex: 1; min-width: 100px; padding: 10px 8px; border: none; border-radius: 8px;
      font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700;
      letter-spacing: .5px; cursor: pointer; transition: all .2s;
    }
    .btn-vip    { background: linear-gradient(135deg,var(--cyan),var(--purple)); color: #fff; }
    .btn-free   { background: rgba(0,200,255,.1); border: 1px solid rgba(0,200,255,.3); color: var(--cyan); }
    .btn-result { background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.3); color: var(--green); }
    .btn-vip:active, .btn-free:active, .btn-result:active { opacity: .7; transform: scale(.97); }

    /* Manual pick */
    .manual-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .form-row   { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-row.full { grid-template-columns: 1fr; }
    .field-s    { display: flex; flex-direction: column; gap: 5px; }
    .field-s label { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--t3); }
    .field-s input, .field-s select {
      background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
      padding: 10px 12px; color: var(--t1); font-size: 13px; outline: none; width: 100%;
    }
    .field-s input:focus, .field-s select:focus { border-color: var(--cyan); }
    .field-s select option { background: var(--card); }

    /* Toast */
    #toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      background: var(--cyan); color: #000; font-family: 'Space Mono', monospace;
      font-size: 12px; font-weight: 700; padding: 12px 24px; border-radius: 50px;
      opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; z-index: 99;
    }
    #toast.show { opacity: 1; }
    #toast.err  { background: var(--red); color: #fff; }
  </style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="screen-login">
  <div class="login-logo">SHARP<span style="color:#fff">IQ</span></div>
  <div class="login-sub">Panel Privado</div>
  <div class="login-box">
    <input type="password" id="pin" placeholder="Contraseña" autocomplete="off" onkeydown="if(event.key==='Enter')login()">
    <button class="btn-grad" onclick="login()">Entrar</button>
    <div class="login-err" id="login-err">Contraseña incorrecta</div>
  </div>
</div>

<!-- ── SETUP TOKEN ── -->
<div id="screen-setup">
  <div class="setup-title">Configurar tokens Telegram</div>
  <div class="setup-note">Solo la primera vez. Los datos se guardan en tu dispositivo.</div>
  <div class="field">
    <label>Token del bot (@sharpiq_alertas_bot)</label>
    <input type="text" id="cfg-token" placeholder="123456789:AAFxxx...">
  </div>
  <div class="field">
    <label>ID Canal VIP</label>
    <input type="text" id="cfg-vip" placeholder="-1003833982154">
  </div>
  <div class="field">
    <label>ID Canal Free</label>
    <input type="text" id="cfg-free" placeholder="-1003834900758">
  </div>
  <button class="btn-grad" onclick="guardarConfig()">Guardar y continuar</button>
</div>

<!-- ── MAIN PANEL ── -->
<div id="screen-main">
  <div class="panel-header">
    <div class="panel-logo">SHARP<span style="color:#fff">IQ</span></div>
    <button class="btn-logout" onclick="logout()">Salir</button>
  </div>

  <!-- Predicciones del día -->
  <div>
    <div class="section-label">Predicciones de hoy — <span id="fecha-hoy"></span></div>
    <div id="pred-list" style="display:flex;flex-direction:column;gap:12px">
      <div style="color:var(--t3);font-size:13px;padding:20px 0">Cargando predicciones...</div>
    </div>
    <button class="btn-grad" style="width:100%;margin-top:14px" onclick="enviarTodoVip()">📢 Enviar TODAS al Canal VIP</button>
    <button style="width:100%;margin-top:8px;padding:12px;border-radius:10px;border:1px solid rgba(0,200,255,.3);background:rgba(0,200,255,.08);color:var(--cyan);font-family:'Space Mono',monospace;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:.5px" onclick="enviarTeaserFree()">📣 Enviar Teaser al Canal Free</button>
  </div>

  <!-- Pick manual -->
  <div>
    <div class="section-label">Publicar pick manual</div>
    <div class="manual-card">
      <div class="form-row">
        <div class="field-s">
          <label>Partido</label>
          <input type="text" id="m-partido" placeholder="Real Madrid vs Barça">
        </div>
        <div class="field-s">
          <label>Liga</label>
          <input type="text" id="m-liga" placeholder="La Liga">
        </div>
      </div>
      <div class="form-row">
        <div class="field-s">
          <label>Predicción</label>
          <input type="text" id="m-pred" placeholder="Over 2.5 Goles">
        </div>
        <div class="field-s">
          <label>Cuota</label>
          <input type="text" id="m-cuota" placeholder="1.85">
        </div>
      </div>
      <div class="form-row">
        <div class="field-s">
          <label>Hora (COT)</label>
          <input type="text" id="m-hora" placeholder="20:00 COT">
        </div>
        <div class="field-s">
          <label>Confianza %</label>
          <input type="number" id="m-conf" placeholder="72" min="50" max="99">
        </div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn-vip" style="flex:1;padding:12px" onclick="publicarManualVip()">📢 VIP</button>
        <button class="btn-free" style="flex:1;padding:12px" onclick="publicarManualFree()">📣 Free</button>
      </div>
    </div>
  </div>

  <!-- Registrar resultado -->
  <div>
    <div class="section-label">Registrar Resultado</div>
    <div class="manual-card">
      <div class="form-row full">
        <div class="field-s">
          <label>Partido</label>
          <input type="text" id="r-partido" placeholder="Real Madrid vs Barça">
        </div>
      </div>
      <div class="form-row">
        <div class="field-s">
          <label>Predicción dada</label>
          <input type="text" id="r-pred" placeholder="Over 2.5 Goles">
        </div>
        <div class="field-s">
          <label>Cuota</label>
          <input type="text" id="r-cuota" placeholder="1.85">
        </div>
      </div>
      <div class="form-row full">
        <div class="field-s">
          <label>Resultado</label>
          <select id="r-resultado">
            <option value="win">✅ WIN — Acerté</option>
            <option value="loss">❌ LOSS — Fallé</option>
          </select>
        </div>
      </div>
      <button class="btn-result" style="padding:12px;width:100%;font-size:11px;font-weight:700" onclick="publicarResultado()">📊 Publicar Resultado al Canal VIP</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const PASS = 'SharpIQ2026';
let CFG  = {};
let PREDS = [];

// ── AUTH ──────────────────────────────────────────────────────────
function login() {
  const val = document.getElementById('pin').value;
  if (val !== PASS) {
    document.getElementById('login-err').style.display = 'block';
    return;
  }
  localStorage.setItem('siq_auth', '1');
  verificarConfig();
}

function logout() {
  localStorage.removeItem('siq_auth');
  location.reload();
}

function verificarConfig() {
  const token = localStorage.getItem('siq_token');
  if (!token) {
    show('screen-setup');
    return;
  }
  CFG = {
    token: localStorage.getItem('siq_token'),
    vip:   localStorage.getItem('siq_vip')   || '-1003833982154',
    free:  localStorage.getItem('siq_free')  || '-1003834900758',
  };
  show('screen-main');
  cargarPredicciones();
}

function guardarConfig() {
  const t = document.getElementById('cfg-token').value.trim();
  const v = document.getElementById('cfg-vip').value.trim();
  const f = document.getElementById('cfg-free').value.trim();
  if (!t) { toast('Ingresa el token del bot', true); return; }
  localStorage.setItem('siq_token', t);
  if (v) localStorage.setItem('siq_vip', v);
  if (f) localStorage.setItem('siq_free', f);
  CFG = { token: t, vip: v || '-1003833982154', free: f || '-1003834900758' };
  show('screen-main');
  cargarPredicciones();
}

function show(id) {
  ['screen-login','screen-setup','screen-main'].forEach(s => {
    const el = document.getElementById(s);
    el.style.display = s === id ? 'flex' : 'none';
  });
}

// ── CARGAR PREDICCIONES ───────────────────────────────────────────
async function cargarPredicciones() {
  try {
    const r = await fetch('predicciones.json?t=' + Date.now());
    const data = await r.json();
    PREDS = data.predicciones || [];
    const fecha = data.fecha || '';
    document.getElementById('fecha-hoy').textContent = fecha;
    renderPreds();
  } catch(e) {
    document.getElementById('pred-list').innerHTML =
      '<div style="color:var(--red);font-size:13px">No se encontró predicciones.json — corre el motor primero.</div>';
  }
}

function renderPreds() {
  const container = document.getElementById('pred-list');
  if (!PREDS.length) {
    container.innerHTML = '<div style="color:var(--t3);font-size:13px;padding:20px 0">Sin predicciones para hoy.</div>';
    return;
  }
  const CUOTA_MAP = {victoria_local:'1',empate:'X',victoria_visita:'2',over25:'over25',under25:'under25',btts_si:'btts_si',btts_no:'btts_no',over15:'over15',over35:'over35'};
  const NOMBRES   = {victoria_local:'Local (1)',empate:'Empate (X)',victoria_visita:'Visitante (2)',over25:'Over 2.5',under25:'Under 2.5',btts_si:'BTTS Sí',btts_no:'BTTS No',over15:'Over 1.5',over35:'Over 3.5'};

  container.innerHTML = PREDS.map((p, i) => {
    const hora_utc = p.hora || '00:00';
    const [h, m]   = hora_utc.split(':');
    const hora_cot = String((parseInt(h)-5+24)%24).padStart(2,'0') + ':' + m + ' COT';
    const probs    = p.probabilidades;
    const pred_p   = p.prediccion_principal;

    // Mejor value bet
    let mejorMk = null, mejorVb = null, mejorEv = -999;
    Object.entries(p.value_bets || {}).forEach(([mk, vb]) => {
      if (vb && typeof vb.ev_porcentaje === 'number' && vb.ev_porcentaje > mejorEv) {
        mejorEv = vb.ev_porcentaje; mejorMk = mk; mejorVb = vb;
      }
    });

    let evHtml = '';
    if (mejorVb) {
      const ck    = CUOTA_MAP[mejorMk] || '1';
      const cuota = p.cuotas?.[ck] || '';
      const ev    = mejorVb.ev_porcentaje;
      const cls   = ev > 0 ? 'ev-pos' : 'ev-neg';
      const emoji = mejorVb.clasificacion === 'ALTO VALOR' ? '🔥' : (ev > 0 ? '💰' : '📊');
      evHtml = `<div class="pred-ev"><span class="${cls}">${emoji} ${NOMBRES[mejorMk]||mejorMk} @ ${cuota} — EV: ${ev>=0?'+':''}${ev}%</span></div>`;
    }

    return `<div class="pred-card">
      <div class="pred-top">
        <div>
          <div class="pred-partido">${p.local} vs ${p.visitante}</div>
          <div class="pred-liga">${p.liga || ''}</div>
        </div>
        <div class="pred-hora">${hora_cot}</div>
      </div>
      <div class="pred-probs">1: ${probs.victoria_local}% · X: ${probs.empate}% · 2: ${probs.victoria_visita}%</div>
      <div class="pred-pick">🎯 ${pred_p.mercado} (${pred_p.prob}%)</div>
      ${evHtml}
      <div class="pred-actions">
        <button class="btn-vip"    onclick="enviarPredVip(${i})">📢 VIP</button>
        <button class="btn-free"   onclick="enviarPredFree(${i})">📣 Free</button>
        <button class="btn-result" onclick="llenarResultado(${i})">✅ Resultado</button>
      </div>
    </div>`;
  }).join('');
}

// ── TELEGRAM ──────────────────────────────────────────────────────
async function tgSend(chatId, text) {
  const url = `https://api.telegram.org/bot${CFG.token}/sendMessage`;
  const r = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ chat_id: chatId, text, parse_mode: 'HTML' })
  });
  const d = await r.json();
  return d.ok;
}

function buildMsgVip(p) {
  const CUOTA_MAP = {victoria_local:'1',empate:'X',victoria_visita:'2',over25:'over25',under25:'under25',btts_si:'btts_si',btts_no:'btts_no',over15:'over15',over35:'over35'};
  const NOMBRES   = {victoria_local:'Local (1)',empate:'Empate (X)',victoria_visita:'Visitante (2)',over25:'Over 2.5',under25:'Under 2.5',btts_si:'BTTS Sí',btts_no:'BTTS No',over15:'Over 1.5',over35:'Over 3.5'};
  const [h,m] = (p.hora||'00:00').split(':');
  const hora_cot = String((parseInt(h)-5+24)%24).padStart(2,'0')+':'+m+' COT';
  const probs  = p.probabilidades;
  const pred_p = p.prediccion_principal;

  let mejorMk=null,mejorVb=null,mejorEv=-999;
  Object.entries(p.value_bets||{}).forEach(([mk,vb])=>{
    if(vb && typeof vb.ev_porcentaje==='number' && vb.ev_porcentaje>mejorEv){mejorEv=vb.ev_porcentaje;mejorMk=mk;mejorVb=vb;}
  });

  let evLinea = '';
  if(mejorVb){
    const ck=CUOTA_MAP[mejorMk]||'1';
    const cuota=p.cuotas?.[ck]||'';
    const casa=p.cuotas?.[ck+'_casa']||'';
    const ev=mejorVb.ev_porcentaje;
    const emoji=mejorVb.clasificacion==='ALTO VALOR'?'🔥':(ev>0?'💰':'📊');
    evLinea=`\n${emoji} <b>${NOMBRES[mejorMk]||mejorMk}</b> @ ${cuota}${casa?' ['+casa+']':''} | EV: ${ev>=0?'+':''}${ev}%`;
  }

  return `⚽ <b>${p.local} vs ${p.visitante}</b>\n🏆 ${p.liga||''} | ${hora_cot}\n\n📈 1:${probs.victoria_local}% · X:${probs.empate}% · 2:${probs.victoria_visita}%\n🎯 <b>${pred_p.mercado}</b> (${pred_p.prob}% confianza)${evLinea}\n\n<i>SharpIQ — La ventaja inteligente</i>`;
}

function buildMsgFree(p) {
  const [h,m] = (p.hora||'00:00').split(':');
  const hora_cot = String((parseInt(h)-5+24)%24).padStart(2,'0')+':'+m+' COT';
  return `⚽ <b>${p.local} vs ${p.visitante}</b>\n🏆 ${p.liga||''} | ${hora_cot}\n\n📊 Predicción: 🔒 <b>Solo VIP</b>\n💵 Cuota: 🔒 <b>Solo VIP</b>\n\n🔥 Únete al canal VIP → https://t.me/sharpiq_alertas_bot\n\n<i>SharpIQ — La ventaja inteligente · sharpiq.co</i>`;
}

async function enviarPredVip(i) {
  const ok = await tgSend(CFG.vip, buildMsgVip(PREDS[i]));
  toast(ok ? '✓ Enviado al VIP' : '✗ Error al enviar', !ok);
}

async function enviarPredFree(i) {
  const ok = await tgSend(CFG.free, buildMsgFree(PREDS[i]));
  toast(ok ? '✓ Enviado al Free' : '✗ Error al enviar', !ok);
}

async function enviarTodoVip() {
  if (!PREDS.length) { toast('Sin predicciones cargadas', true); return; }
  const fecha = document.getElementById('fecha-hoy').textContent;
  let texto = `📊 <b>SharpIQ — Predicciones del día</b>\n📅 ${fecha}\n\n`;
  PREDS.forEach(p => { texto += buildMsgVip(p) + '\n\n──────────────\n\n'; });
  texto += '<i>SharpIQ — La ventaja inteligente · sharpiq.co</i>';
  const ok = await tgSend(CFG.vip, texto);
  toast(ok ? `✓ ${PREDS.length} predicciones enviadas al VIP` : '✗ Error al enviar', !ok);
}

async function enviarTeaserFree() {
  if (!PREDS.length) { toast('Sin predicciones cargadas', true); return; }
  const fecha = document.getElementById('fecha-hoy').textContent;
  let texto = `⚡ <b>SharpIQ — Picks del día</b>\n📅 ${fecha}\n\n`;
  PREDS.forEach(p => {
    const [h,m] = (p.hora||'00:00').split(':');
    const hora_cot = String((parseInt(h)-5+24)%24).padStart(2,'0')+':'+m+' COT';
    texto += `⚽ ${p.local} vs ${p.visitante} | ${p.liga||''}\n⏰ ${hora_cot} | Predicción: 🔒 VIP\n\n`;
  });
  texto += `🔥 <b>¿Quieres los picks exactos?</b>\nÚnete al canal VIP → https://t.me/sharpiq_alertas_bot\n\n<i>SharpIQ — La ventaja inteligente · sharpiq.co</i>`;
  const ok = await tgSend(CFG.free, texto);
  toast(ok ? '✓ Teaser enviado al Free' : '✗ Error al enviar', !ok);
}

// ── PICK MANUAL ───────────────────────────────────────────────────
async function publicarManualVip() {
  const partido = document.getElementById('m-partido').value.trim();
  const liga    = document.getElementById('m-liga').value.trim();
  const pred    = document.getElementById('m-pred').value.trim();
  const cuota   = document.getElementById('m-cuota').value.trim();
  const hora    = document.getElementById('m-hora').value.trim() || '—';

// ── RESULTADO ─────────────────────────────────────────────────────
function llenarResultado(i) {
  const p = PREDS[i];
  document.getElementById('r-partido').value = `${p.local} vs ${p.visitante}`;
  const pred_p = p.prediccion_principal;
  document.getElementById('r-pred').value = pred_p?.mercado || '';
  const CUOTA_MAP = {victoria_local:'1',empate:'X',victoria_visita:'2',over25:'over25'};
  const mk = Object.keys(p.value_bets||{}).find(k=>p.value_bets[k]?.tiene_valor) || 'victoria_local';
  const ck = CUOTA_MAP[mk]||'1';
  document.getElementById('r-cuota').value = p.cuotas?.[ck]||'';
  window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
}

async function publicarResultado() {
  const partido   = document.getElementById('r-partido').value.trim();
  const pred      = document.getElementById('r-pred').value.trim();
  const cuota     = document.getElementById('r-cuota').value.trim();
  const resultado = document.getElementById('r-resultado').value;
  if (!partido) { toast('Completa el partido', true); return; }

  const esWin  = resultado === 'win';
  const emoji  = esWin ? '✅' : '❌';
  const titulo = esWin ? 'WIN — ¡Acertamos!' : 'LOSS — Falló';
  const ganancia = cuota ? (esWin ? `+${(parseFloat(cuota)-1).toFixed(2)}u` : '-1.00u') : '';
  const comentario = esWin
    ? '¡Predicción acertada! El modelo sigue funcionando. 🤖🔥'
    : 'No todas entran. El largo plazo nos da la razón 💡';

  const texto = `${emoji} <b>Resultado — ${partido}</b>\n\n📊 Predicción: ${pred}\n💵 Cuota: ${cuota}${ganancia ? '\n📈 P&L: <b>'+ganancia+'</b>' : ''}\n\n${comentario}\n\n<i>SharpIQ — La ventaja inteligente · sharpiq.co</i>`;
  const ok = await tgSend(CFG.vip, texto);
  toast(ok ? '✓ Resultado publicado en VIP' : '✗ Error al enviar', !ok);
}

// ── TOAST ─────────────────────────────────────────────────────────
let _toastTimer;
function toast(msg, err=false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className   = 'show' + (err ? ' err' : '');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.className = ''; }, 3000);
}

// ── INIT ──────────────────────────────────────────────────────────
window.onload = () => {
  if (localStorage.getItem('siq_auth') === '1') {
    verificarConfig();
  }
  document.getElementById('pin').focus();
};

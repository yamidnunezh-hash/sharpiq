<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C8FF"/>
      <stop offset="100%" stop-color="#7B5CF0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Hexagon background -->
  <polygon points="32,3 56,17 56,47 32,61 8,47 8,17"
    fill="#07051A" stroke="url(#gc)" stroke-width="2.5" filter="url(#glow)"/>
  <!-- Trend line / analytics symbol -->
  <polyline points="16,42 24,34 31,38 40,24 48,20"
    fill="none" stroke="url(#gc)" stroke-width="2.5"
    stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Circle at peak -->
  <circle cx="48" cy="20" r="3.5" fill="#00C8FF" filter="url(#glow)"/>
</svg>

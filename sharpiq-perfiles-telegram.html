<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SharpIQ — Perfiles Telegram</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #111827;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    font-family: Arial, sans-serif;
    gap: 48px;
  }
  h1 {
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  h1 span { color: #00C896; }
  .grid {
    display: flex;
    gap: 40px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .card label {
    color: #9ca3af;
    font-size: 13px;
    text-align: center;
    line-height: 1.5;
  }
  .card label strong { color: #e5e7eb; font-size: 15px; display: block; }
  button {
    padding: 10px 28px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: opacity 0.2s;
  }
  button:hover { opacity: 0.85; }
  .btn-vip  { background: #FFD700; color: #0D1117; }
  .btn-free { background: #00C896; color: #0D1117; }
  .btn-bot  { background: #4A9EFF; color: #0D1117; }
  .note {
    color: #6b7280;
    font-size: 12px;
    text-align: center;
    max-width: 560px;
    line-height: 1.6;
  }
</style>
</head>
<body>

<h1>SharpIQ — <span>Perfiles Telegram</span></h1>

<div class="grid">

  <!-- VIP -->
  <div class="card">
    <svg id="svg-vip" width="256" height="256" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="bg1" cx="38%" cy="32%" r="70%">
          <stop offset="0%" stop-color="#1c2340"/>
          <stop offset="100%" stop-color="#0D1117"/>
        </radialGradient>
        <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <circle cx="256" cy="256" r="256" fill="url(#bg1)"/>
      <!-- Chart line -->
      <polyline points="72,368 148,308 204,334 272,188 328,220 392,90"
                fill="none" stroke="#FFD700" stroke-width="16"
                stroke-linecap="round" stroke-linejoin="round"
                filter="url(#glow1)"/>
      <!-- Arrow head -->
      <polygon points="392,90 364,148 418,138" fill="#FFD700" filter="url(#glow1)"/>
      <!-- Peak dot -->
      <circle cx="272" cy="188" r="10" fill="#FFD700" opacity="0.9"/>
      <!-- Área bajo la curva (sutil) -->
      <polygon points="72,368 148,308 204,334 272,188 328,220 392,90 392,380 72,380"
               fill="#FFD700" opacity="0.06"/>
      <!-- SharpIQ -->
      <text x="256" y="434"
            font-family="'Arial Black','Arial',sans-serif"
            font-size="58" font-weight="900"
            fill="#ffffff" text-anchor="middle"
            letter-spacing="-1">SharpIQ</text>
      <!-- Badge VIP -->
      <rect x="172" y="453" width="168" height="36" rx="18" fill="#FFD700"/>
      <text x="256" y="477"
            font-family="'Arial Black','Arial',sans-serif"

            fill="#0D1117" text-anchor="middle" letter-spacing="3">▸ VIP ◂</text>
    </svg>
    <label><strong>Canal VIP</strong>@SharpIQVIP</label>
    <button class="btn-vip" onclick="descargar('svg-vip','sharpiq-vip.png')">⬇ Descargar VIP</button>
  </div>

  <!-- FREE -->
  <div class="card">
    <svg id="svg-free" width="256" height="256" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

          <stop offset="0%" stop-color="#0d1f1c"/>
          <stop offset="100%" stop-color="#0D1117"/>
        </radialGradient>
        <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <circle cx="256" cy="256" r="256" fill="url(#bg2)"/>
      <polyline points="72,368 148,308 204,334 272,188 328,220 392,90"
                fill="none" stroke="#00C896" stroke-width="16"
                stroke-linecap="round" stroke-linejoin="round"
                filter="url(#glow2)"/>
      <polygon points="392,90 364,148 418,138" fill="#00C896" filter="url(#glow2)"/>
      <circle cx="272" cy="188" r="10" fill="#00C896" opacity="0.9"/>
      <polygon points="72,368 148,308 204,334 272,188 328,220 392,90 392,380 72,380"
               fill="#00C896" opacity="0.06"/>
      <text x="256" y="434"
            font-family="'Arial Black','Arial',sans-serif"
            font-size="58" font-weight="900"
            fill="#ffffff" text-anchor="middle"
            letter-spacing="-1">SharpIQ</text>
      <rect x="152" y="453" width="208" height="36" rx="18" fill="#00C896"/>
      <text x="256" y="477"
            font-family="'Arial Black','Arial',sans-serif"
            font-size="20" font-weight="900"
            fill="#0D1117" text-anchor="middle" letter-spacing="2">COMUNIDAD</text>
    </svg>
    <label><strong>Canal Free</strong>@sharpiq_co</label>
    <button class="btn-free" onclick="descargar('svg-free','sharpiq-free.png')">⬇ Descargar Free</button>
  </div>

  <!-- BOT / ENGINE -->
  <div class="card">
    <svg id="svg-bot" width="256" height="256" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="bg3" cx="38%" cy="32%" r="70%">
          <stop offset="0%" stop-color="#0d1526"/>
          <stop offset="100%" stop-color="#0D1117"/>
        </radialGradient>
        <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <circle cx="256" cy="256" r="256" fill="url(#bg3)"/>
      <polyline points="72,368 148,308 204,334 272,188 328,220 392,90"
                fill="none" stroke="#4A9EFF" stroke-width="16"
                stroke-linecap="round" stroke-linejoin="round"
                filter="url(#glow3)"/>

      <circle cx="272" cy="188" r="10" fill="#4A9EFF" opacity="0.9"/>
      <polygon points="72,368 148,308 204,334 272,188 328,220 392,90 392,380 72,380"
               fill="#4A9EFF" opacity="0.06"/>
      <text x="256" y="434"
            font-family="'Arial Black','Arial',sans-serif"
            font-size="58" font-weight="900"
            fill="#ffffff" text-anchor="middle"
            letter-spacing="-1">SharpIQ</text>
      <rect x="178" y="453" width="156" height="36" rx="18" fill="#4A9EFF"/>
      <text x="256" y="477"
            font-family="'Arial Black','Arial',sans-serif"
            font-size="20" font-weight="900"
            fill="#0D1117" text-anchor="middle" letter-spacing="3">ENGINE</text>
    </svg>
    <label><strong>Bot Motor</strong>@sharpiq_alertas_bot</label>
    <button class="btn-bot" onclick="descargar('svg-bot','sharpiq-engine.png')">⬇ Descargar Bot</button>
  </div>

</div>

<p class="note">
  Haz clic en cada botón para descargar el PNG 512×512 listo para subir a Telegram.<br>
  En Telegram: abre el canal → Editar → foto de perfil → sube el PNG.
</p>

<script>
function descargar(svgId, filename) {
  const svg = document.getElementById(svgId);
  const clone = svg.cloneNode(true);
  clone.setAttribute('width', '512');
  clone.setAttribute('height', '512');

  const svgData = new XMLSerializer().serializeToString(clone);
  const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(svgBlob);

  const img = new Image();
  img.onload = function () {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, 512, 512);
    URL.revokeObjectURL(url);

    const a = document.createElement('a');
    a.download = filename;
    a.href = canvas.toDataURL('image/png');
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  };
  img.src = url;
}
</script>

</body>
</html>

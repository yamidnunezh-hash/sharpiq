<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SharpIQ — Acceso</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#07051A;--card:#0d0b2a;--gold:#00C8FF;--purple:#7B5CF0;--border:rgba(0,200,255,.15);--t1:#e2e8f0;--t2:#94a3b8;--t3:#475569;--green:#22c55e;--red:#ef4444}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--t1);font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(0,200,255,.07) 0%,transparent 65%);pointer-events:none}
    body::after{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 80% 80%,rgba(123,92,240,.05) 0%,transparent 50%);pointer-events:none}

    .wrap{width:100%;max-width:420px;position:relative;z-index:1}

    .logo{text-align:center;margin-bottom:44px}
    .logo-text{font-family:'Orbitron',monospace;font-size:2.2rem;font-weight:900;letter-spacing:4px;color:#fff}
    .logo-text span{color:var(--gold)}
    .logo-tag{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--t3);margin-top:8px}

    .card{background:rgba(13,11,42,.85);border:1px solid var(--border);border-radius:16px;padding:36px 32px;backdrop-filter:blur(20px)}
    .card-title{font-family:'Orbitron',monospace;font-size:1.1rem;font-weight:700;text-align:center;margin-bottom:6px}
    .card-sub{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);text-align:center;margin-bottom:32px}

    .input-wrap{position:relative;margin-bottom:18px}
    .input-wrap input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;padding:14px 48px 14px 18px;font-size:15px;color:var(--t1);font-family:'Inter',sans-serif;outline:none;transition:border-color .2s;letter-spacing:2px}
    .input-wrap input:focus{border-color:rgba(0,200,255,.45);background:rgba(0,200,255,.03)}
    .input-wrap input::placeholder{letter-spacing:3px;color:var(--t3)}
    .eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--t3);padding:4px;line-height:1;font-size:16px}

    .btn{width:100%;background:linear-gradient(135deg,#00C8FF,#7B5CF0);color:#fff;border:none;border-radius:10px;padding:15px;font-family:'Orbitron',monospace;font-size:11px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:opacity .2s,transform .1s}
    .btn:hover{opacity:.92}
    .btn:active{transform:scale(.98)}
    .btn:disabled{opacity:.5;cursor:not-allowed}

    .err{color:var(--red);font-size:12px;font-family:'Space Mono',monospace;text-align:center;margin-top:14px;display:none;padding:10px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:8px}

    .back{text-align:center;margin-top:28px}
    .back a{font-size:12px;color:var(--t3);text-decoration:none;font-family:'Space Mono',monospace;transition:color .2s}
    .back a:hover{color:var(--t1)}

    .hint{margin-top:20px;padding:14px;background:rgba(0,200,255,.04);border:1px solid rgba(0,200,255,.1);border-radius:8px;text-align:center}
    .hint p{font-size:12px;color:var(--t3);font-family:'Space Mono',monospace;line-height:1.6}
    .hint strong{color:var(--t2)}
  </style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="logo-text">SHARP<span>IQ</span></div>
    <div class="logo-tag">La ventaja inteligente</div>
  </div>

  <div class="card">
    <div class="card-title">Acceso Exclusivo</div>
    <div class="card-sub">Ingresa tu clave de acceso</div>

    <div class="input-wrap">
      <input type="password" id="passInput" placeholder="••••••••••" autocomplete="current-password"
        onkeydown="if(event.key==='Enter')doLogin()">
      <button class="eye" onclick="toggleEye()" title="Mostrar/ocultar">👁</button>
    </div>

    <button class="btn" id="btnEnter" onclick="doLogin()">ENTRAR →</button>
    <div class="err" id="errMsg">Clave incorrecta. Intenta de nuevo.</div>
  </div>

  <div class="hint">
    <p>¿Eres suscriptor VIP?<br><strong>Telegram → /clave</strong> para obtener tu acceso</p>
  </div>

  <div class="back"><a href="/">← Volver a sharpiq.co</a></div>
</div>

<script>
// Hashes SHA-256 — las claves reales nunca aparecen en el código fuente
// Para cambiar una clave: genera su SHA-256 y reemplaza el hash aquí
const H_VIP   = '092bd1708770c76f19399cd489941d75b1043a8232ff560485279fd0806aed14';
const H_ADMIN = '5f2e24b1a2a3df2cd8f8c3f064e5155d39b36d701f543c0ab4b34938d82abc70';

async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function toggleEye(){
  const i=document.getElementById('passInput');
  i.type=i.type==='password'?'text':'password';
}

async function doLogin(){
  const btn=document.getElementById('btnEnter');
  const err=document.getElementById('errMsg');
  const pass=document.getElementById('passInput').value.trim();
  if(!pass)return;

  btn.disabled=true;
  btn.textContent='VERIFICANDO...';
  err.style.display='none';

  const h = await sha256(pass);

  if(h===H_ADMIN){
    localStorage.setItem('sharpiq_role','admin');
    localStorage.setItem('sharpiq_auth',Date.now());
    window.location.href='admin.html';
  } else if(h===H_VIP){
    localStorage.setItem('sharpiq_role','vip');
    localStorage.setItem('sharpiq_auth',Date.now());
    window.location.href='predicciones.html';
  } else {
    err.style.display='block';
    btn.disabled=false;
    btn.textContent='ENTRAR →';
    document.getElementById('passInput').value='';
    document.getElementById('passInput').focus();
  }
}

(function(){
  const role=localStorage.getItem('sharpiq_role');
  const auth=parseInt(localStorage.getItem('sharpiq_auth')||'0');
  if(role&&Date.now()-auth<24*60*60*1000){
    window.location.href=role==='admin'?'admin.html':'predicciones.html';
  }
})();
</script>
</body>
</html>

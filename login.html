<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SharpIQ — Iniciar sesión</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0a0e1a;--card:#111a2e;--gold:#00C8FF;--purple:#7B5CF0;--border:rgba(0,200,255,.18);--t1:#eef3fb;--t2:#97a6bd;--t3:#94a3b8;--green:#22c55e;--red:#ef4444}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--t1);font-family:Inter,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(0,200,255,.07) 0%,transparent 65%);pointer-events:none}
    body::after{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 80% 80%,rgba(123,92,240,.05) 0%,transparent 50%);pointer-events:none}
    .wrap{width:100%;max-width:420px;position:relative;z-index:1}
    .logo{text-align:center;margin-bottom:44px}
    .logo-text{font-family:Inter,sans-serif;font-size:2.2rem;font-weight:900;letter-spacing:4px;color:#fff}
    .logo-text span{color:var(--gold)}
    .logo-tag{font-family:Inter,sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--t3);margin-top:8px}
    .card{background:rgba(8,15,28,.85);border:1px solid var(--border);border-radius:16px;padding:36px 32px;backdrop-filter:blur(20px)}
    .card-title{font-family:Inter,sans-serif;font-size:1.1rem;font-weight:700;text-align:center;margin-bottom:6px}
    .card-sub{font-family:Inter,sans-serif;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);text-align:center;margin-bottom:32px}
    .field{margin-bottom:16px}
    .field label{display:block;font-size:11px;font-family:Inter,sans-serif;color:var(--t3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
    .input-wrap{position:relative}
    .input-wrap input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;padding:14px 48px 14px 18px;font-size:15px;color:var(--t1);font-family:Inter,sans-serif;outline:none;transition:border-color .2s}
    .input-wrap input:focus{border-color:rgba(0,200,255,.45);background:rgba(0,200,255,.03)}
    .eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--t3);padding:4px;line-height:1;font-size:16px}
    .btn{width:100%;background:linear-gradient(135deg,#00C8FF,#7B5CF0);color:#fff;border:none;border-radius:10px;padding:15px;font-family:Inter,sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:opacity .2s,transform .1s;margin-top:8px}
    .btn:hover{opacity:.92}
    .btn:active{transform:scale(.98)}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .err{color:var(--red);font-size:12px;font-family:Inter,sans-serif;text-align:center;margin-top:14px;display:none;padding:10px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:8px}
    .links{text-align:center;margin-top:24px;font-family:Inter,sans-serif;font-size:11px;color:var(--t3)}
    .links a{color:var(--gold);text-decoration:none}
    .divider{display:flex;align-items:center;gap:12px;margin:20px 0}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
    .divider span{font-family:Inter,sans-serif;font-size:10px;color:var(--t3);letter-spacing:1px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="logo-text">SHARP<span>IQ</span></div>
    <div class="logo-tag">La ventaja inteligente</div>
  </div>

  <div class="card">
    <div class="card-title">Iniciar sesión</div>
    <div class="card-sub">Accede a tus picks inteligentes</div>

    <div class="field">
      <label>Email</label>
      <div class="input-wrap">
        <input type="email" id="emailInput" placeholder="tu@email.com" autocomplete="email"
          onkeydown="if(event.key==='Enter')doLogin()">
      </div>
    </div>

    <div class="field">
      <label>Contraseña</label>
      <div class="input-wrap">
        <input type="password" id="passInput" placeholder="••••••••" autocomplete="current-password"
          onkeydown="if(event.key==='Enter')doLogin()">
        <button class="eye" onclick="toggleEye()" title="Mostrar/ocultar">👁</button>
      </div>
    </div>

    <button class="btn" id="btnEnter" onclick="doLogin()">ENTRAR →</button>
    <div class="err" id="errMsg"></div>
  </div>

  <div class="links">
    ¿No tienes cuenta? <a href="registro.html">Crear cuenta gratis</a>
  </div>

  <div style="margin-top:20px;text-align:center">
    <div style="font-family:Inter,sans-serif;font-size:11px;color:#475569;margin-bottom:12px">— o suscríbete directamente —</div>
    <button onclick="irAPago(this)" style="width:100%;background:linear-gradient(135deg,#00C8FF,#7B5CF0);color:#fff;border:none;border-radius:10px;padding:14px;font-family:Inter,sans-serif;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:2px">
      ACTIVAR VIP — $60.000 COP/mes
    </button>
  </div>
</div>

<script>
const API = 'https://api.sharpiq.co';

function irAPago(){
  // Crear cuenta primero → el pago queda amarrado y el VIP se activa solo
  window.location.href = 'registro.html?plan=vip&next=pago';
}

// Hashes SHA-256 para acceso admin offline (sin API)
const H_ADMIN = '5f2e24b1a2a3df2cd8f8c3f064e5155d39b36d701f543c0ab4b34938d82abc70';

async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function toggleEye(){
  const i = document.getElementById('passInput');
  i.type = i.type === 'password' ? 'text' : 'password';
}

async function doLogin(){
  const email = document.getElementById('emailInput').value.trim();
  const pass  = document.getElementById('passInput').value;
  const btn   = document.getElementById('btnEnter');
  const err   = document.getElementById('errMsg');

  if(!pass){ err.textContent = 'Ingresa tu contraseña.'; err.style.display = 'block'; return; }

  btn.disabled = true;
  btn.textContent = 'VERIFICANDO...';
  err.style.display = 'none';

  // Modo admin offline: sin email → solo hash check
  if(!email){
    const h = await sha256(pass);
    if(h === H_ADMIN){
      localStorage.setItem('sharpiq_role', 'admin');
      localStorage.setItem('sharpiq_auth', Date.now());
      window.location.href = 'predicciones.html';
    } else {
      err.textContent = 'Ingresa tu email para continuar.';
      err.style.display = 'block';
      btn.disabled = false; btn.textContent = 'ENTRAR →';
    }
    return;
  }

  // Login normal via API
  try {
    const r = await fetch(`${API}/auth/login`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, password: pass})
    });
    const data = await r.json();
    if(!r.ok) throw new Error(data.detail || 'Credenciales incorrectas');

    localStorage.setItem('sharpiq_token', data.token);
    localStorage.setItem('sharpiq_plan',  data.plan);
    if(data.codigo_ref) localStorage.setItem('sharpiq_ref', data.codigo_ref);

    if(data.plan === 'admin'){
      localStorage.setItem('sharpiq_role', 'admin');
      localStorage.setItem('sharpiq_auth', Date.now());
      window.location.href = 'predicciones.html';
    } else {
      const next = new URLSearchParams(location.search).get('next');
      window.location.href = next === 'upgrade' ? 'cuenta.html?upgrade=1' : 'cuenta.html';
    }
  } catch(e){
    err.textContent = e.message;
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'ENTRAR →';
  }
}

// Auto-redirect si ya tiene sesión activa
(function(){
  const token = localStorage.getItem('sharpiq_token');
  const role  = localStorage.getItem('sharpiq_role');
  const auth  = parseInt(localStorage.getItem('sharpiq_auth') || '0');

  if(role === 'admin' && Date.now() - auth < 24*60*60*1000){
    window.location.href = 'predicciones.html'; return;
  }
  if(token){
    const next = new URLSearchParams(location.search).get('next');
    window.location.href = next === 'upgrade' ? 'cuenta.html?upgrade=1' : 'cuenta.html';
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SharpIQ — Crear cuenta</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0a0e1a;--card:#111a2e;--gold:#00C8FF;--purple:#7B5CF0;--border:rgba(0,200,255,.18);--t1:#eef3fb;--t2:#97a6bd;--t3:#94a3b8;--green:#22c55e;--red:#ef4444}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--t1);font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(0,200,255,.07) 0%,transparent 65%);pointer-events:none}
    .wrap{width:100%;max-width:440px;position:relative;z-index:1}
    .logo{text-align:center;margin-bottom:36px}
    .logo-text{font-family:'Inter',sans-serif;font-size:2rem;font-weight:900;letter-spacing:4px;color:#fff}
    .logo-text span{color:var(--gold)}
    .logo-tag{font-family:'Inter',sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--t3);margin-top:6px}
    .card{background:rgba(8,15,28,.9);border:1px solid var(--border);border-radius:16px;padding:36px 32px;backdrop-filter:blur(20px)}
    .card-title{font-family:'Inter',sans-serif;font-size:1.1rem;font-weight:700;text-align:center;margin-bottom:4px}
    .card-sub{font-family:'Inter',sans-serif;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);text-align:center;margin-bottom:28px}
    .field{margin-bottom:16px}
    .field label{display:block;font-size:11px;font-family:'Inter',sans-serif;color:var(--t3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
    .field input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;padding:13px 16px;font-size:15px;color:var(--t1);font-family:'Inter',sans-serif;outline:none;transition:border-color .2s}
    .field input:focus{border-color:rgba(0,200,255,.45)}
    .ref-badge{font-size:11px;color:var(--green);font-family:'Inter',sans-serif;margin-top:6px;display:none}
    .btn{width:100%;background:linear-gradient(135deg,#00C8FF,#7B5CF0);color:#fff;border:none;border-radius:10px;padding:15px;font-family:'Inter',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:opacity .2s,transform .1s;margin-top:8px}
    .btn:hover{opacity:.92}
    .btn:active{transform:scale(.98)}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .err{color:var(--red);font-size:12px;font-family:'Inter',sans-serif;text-align:center;margin-top:12px;display:none;padding:10px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:8px}
    .ok{color:var(--green);font-size:12px;font-family:'Inter',sans-serif;text-align:center;margin-top:12px;display:none;padding:10px;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);border-radius:8px}
    .links{text-align:center;margin-top:24px;font-family:'Inter',sans-serif;font-size:11px;color:var(--t3)}
    .links a{color:var(--gold);text-decoration:none}
    .planes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
    .plan-card{border:1px solid var(--border);border-radius:10px;padding:16px 12px;text-align:center;cursor:pointer;transition:all .2s;background:rgba(255,255,255,.03)}
    .plan-card.sel{border-color:var(--gold);background:rgba(0,200,255,.06)}
    .plan-precio{font-family:'Inter',sans-serif;font-size:1.4rem;font-weight:900;color:var(--gold)}
    .plan-nombre{font-size:11px;font-family:'Inter',sans-serif;color:var(--t3);margin-top:4px;text-transform:uppercase}
    .plan-desc{font-size:11px;color:var(--t2);margin-top:6px;line-height:1.5}
  </style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="logo-text">SHARP<span>IQ</span></div>
    <div class="logo-tag">La ventaja inteligente</div>
  </div>

  <div class="card">
    <div class="card-title">Crear cuenta</div>
    <div class="card-sub">Empieza gratis · Sube a VIP cuando quieras</div>

    <div class="planes">
      <div class="plan-card sel" id="planFree" onclick="selPlan('free')">
        <div class="plan-precio">$0</div>
        <div class="plan-nombre">Free</div>
        <div class="plan-desc">2 picks de vista previa al día</div>
      </div>
      <div class="plan-card" id="planVip" onclick="selPlan('vip')">
        <div class="plan-precio">$60.000 COP</div>
        <div class="plan-nombre">VIP / mes</div>
        <div class="plan-desc">Todos los picks EV+ con Pinnacle</div>
      </div>
    </div>

    <div class="field">
      <label>Nombre</label>
      <input type="text" id="nombre" placeholder="Tu nombre" autocomplete="name">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="tu@email.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="pass" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
    </div>
    <input type="hidden" id="refCode" value="">

    <button class="btn" id="btnReg" onclick="registrar()">CREAR CUENTA →</button>
    <div class="err" id="errMsg"></div>
    <div class="ok"  id="okMsg"></div>
  </div>

  <div class="links">
    ¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a>
  </div>
</div>

<script>
const API = 'https://api.sharpiq.co';
let planSel = 'free';

function selPlan(p){
  planSel = p;
  document.getElementById('planFree').classList.toggle('sel', p==='free');
  document.getElementById('planVip').classList.toggle('sel', p==='vip');
}

// Auto-detectar código de referido y plan en URL
(function(){
  const params = new URLSearchParams(location.search);
  const ref  = params.get('ref');
  const plan = params.get('plan');
  if(ref){
    document.getElementById('refCode').value = ref.toUpperCase();
    document.getElementById('refBadge').style.display = 'block';
  }
  if(plan === 'vip'){
    selPlan('vip');
    // Mostrar banner de pago confirmado
    const banner = document.createElement('div');
    banner.style.cssText = 'background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.25);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-family:'Inter',sans-serif;font-size:11px;color:#22c55e;text-align:center';
    banner.textContent = '✅ Pago confirmado — crea tu cuenta para activar el VIP';
    document.querySelector('.box').insertBefore(banner, document.querySelector('.field'));
  }
})();

async function registrar(){
  const nombre = document.getElementById('nombre').value.trim();
  const email  = document.getElementById('email').value.trim();
  const pass   = document.getElementById('pass').value;
  const ref    = document.getElementById('refCode').value.trim();
  const btn    = document.getElementById('btnReg');
  const err    = document.getElementById('errMsg');
  const ok     = document.getElementById('okMsg');

  if(!nombre || !email || pass.length < 8){
    err.textContent = 'Completa todos los campos. Contraseña mínimo 8 caracteres.';
    err.style.display = 'block'; return;
  }

  btn.disabled = true; btn.textContent = 'CREANDO CUENTA...';
  err.style.display = 'none'; ok.style.display = 'none';

  try {
    const r = await fetch(`${API}/auth/register`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({nombre, email, password: pass, ref: ref||null})
    });
    const data = await r.json();
    if(!r.ok) throw new Error(data.detail || 'Error al crear cuenta');

    localStorage.setItem('sharpiq_token', data.token);
    localStorage.setItem('sharpiq_plan',  data.plan);
    localStorage.setItem('sharpiq_ref',   data.codigo_ref);

    if(planSel === 'vip'){
      ok.textContent = 'Cuenta creada. Redirigiendo a pago VIP...';
      ok.style.display = 'block';
      setTimeout(()=>{ window.location.href = 'cuenta.html?upgrade=1'; }, 1500);
    } else {
      ok.textContent = 'Cuenta creada. Bienvenido a SharpIQ.';
      ok.style.display = 'block';
      setTimeout(()=>{ window.location.href = 'cuenta.html'; }, 1500);
    }
  } catch(e){
    err.textContent = e.message;
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'CREAR CUENTA →';
  }
}
</script>
</body>
</html>

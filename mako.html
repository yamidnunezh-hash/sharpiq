<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mako — Tu Analista SharpIQ 🦈</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0e1a;--card:#111a2e;--gold:#00C8FF;--purple:#7B5CF0;--border:rgba(0,200,255,.18);--t1:#eef3fb;--t2:#97a6bd;--t3:#94a3b8;--green:#22c55e;--red:#ef4444;--tg:#229ED9}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--t1);font-family:Inter,sans-serif;min-height:100vh;display:flex;flex-direction:column}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(0,200,255,.08) 0%,transparent 60%);pointer-events:none}
  .top{position:sticky;top:0;z-index:10;background:rgba(10,14,26,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .sh{font-size:1.5rem}
  .brand b{font-size:1.05rem;font-weight:900;letter-spacing:.5px}
  .brand b span{color:var(--gold)}
  .brand small{display:block;font-size:10px;color:var(--t3);letter-spacing:1px;text-transform:uppercase;margin-top:1px}
  .credits{font-family:Inter,sans-serif;font-size:11px;font-weight:700;background:rgba(0,200,255,.1);border:1px solid var(--border);color:var(--gold);padding:6px 12px;border-radius:20px;white-space:nowrap}
  .back{color:var(--t3);text-decoration:none;font-size:12px}
  .wrap{flex:1;width:100%;max-width:760px;margin:0 auto;padding:18px;display:flex;flex-direction:column;position:relative;z-index:1}
  .chat{flex:1;display:flex;flex-direction:column;gap:14px;padding-bottom:16px}
  .msg{display:flex;gap:10px;max-width:88%}
  .msg.me{align-self:flex-end;flex-direction:row-reverse}
  .av{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;background:linear-gradient(135deg,#00C8FF,#7B5CF0)}
  .av.me{background:rgba(255,255,255,.08);font-size:14px;color:var(--t2)}
  .bub{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 15px;font-size:14.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
  .msg.me .bub{background:rgba(0,200,255,.08);border-color:rgba(0,200,255,.3)}
  .aviso{align-self:center;background:rgba(123,92,240,.1);border:1px solid rgba(123,92,240,.3);color:#c4b5fd;font-size:12px;padding:8px 14px;border-radius:10px;text-align:center;max-width:90%}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .chip{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--t2);font-size:12px;padding:7px 12px;border-radius:16px;cursor:pointer;transition:all .15s}
  .chip:hover{border-color:var(--gold);color:var(--t1)}
  .bar{position:sticky;bottom:0;background:rgba(10,14,26,.95);backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:12px 14px}
  .barin{max-width:760px;margin:0 auto;display:flex;gap:9px;align-items:flex-end}
  textarea{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--t1);font-family:Inter,sans-serif;font-size:14.5px;resize:none;outline:none;max-height:120px}
  textarea:focus{border-color:rgba(0,200,255,.45)}
  .send{background:linear-gradient(135deg,#00C8FF,#7B5CF0);border:none;color:#fff;width:46px;height:46px;border-radius:12px;font-size:18px;cursor:pointer;flex-shrink:0;transition:opacity .2s}
  .send:disabled{opacity:.5;cursor:not-allowed}
  .upsell{background:linear-gradient(135deg,rgba(0,200,255,.1),rgba(123,92,240,.1));border:1px solid rgba(0,200,255,.35);border-radius:14px;padding:18px;text-align:center;margin-top:8px}
  .upsell b{color:var(--gold)}
  .btn-vip{display:inline-block;margin-top:12px;background:linear-gradient(135deg,#00C8FF,#7B5CF0);color:#fff;border-radius:10px;padding:12px 26px;font-size:12px;font-weight:800;letter-spacing:1px;text-decoration:none}
  .typing{color:var(--t3);font-size:13px;font-style:italic}
  .login-box{text-align:center;padding:60px 20px}
  .login-box a{color:var(--gold);text-decoration:none;font-weight:700}
  /* Móvil: input más ancho + flecha azul completa a la derecha */
  @media(max-width:600px){
    .wrap{padding:14px 7px}
    .bar{padding:9px 6px}
    .barin{gap:6px;max-width:100%}
    textarea{padding:11px 12px;font-size:15px}
    .send{width:42px;height:42px;font-size:16px}
  }
</style>
</head>
<body>
<div class="top">
  <div class="brand"><span class="sh">🦈</span><div><b>MAKO<span> AI</span></b><small>Analista SharpIQ</small></div></div>
  <div style="display:flex;align-items:center;gap:12px">
    <span class="credits" id="credits">···</span>
    <a class="back" href="cuenta.html">✕</a>
  </div>
</div>

<div class="wrap">
  <div class="chat" id="chat"></div>
</div>

<div class="bar" id="bar" style="display:none">
  <div class="barin">
    <textarea id="q" rows="1" placeholder="Pregúntale a Mako sobre cualquier partido..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();enviar();}"></textarea>
    <button class="send" id="sendBtn" onclick="enviar()">➤</button>
  </div>
</div>

<script>
const API='https://api.sharpiq.co';
const chat=document.getElementById('chat');
const token=localStorage.getItem('sharpiq_token');
let bloqueado=false;
let hist=[];

function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function burbuja(texto,quien){
  const m=document.createElement('div'); m.className='msg'+(quien==='me'?' me':'');
  m.innerHTML=`<div class="av${quien==='me'?' me':''}">${quien==='me'?'🧑':'🦈'}</div><div class="bub">${esc(texto)}</div>`;
  chat.appendChild(m); scroll_(); return m;
}
function aviso(t){ const d=document.createElement('div'); d.className='aviso'; d.textContent=t; chat.appendChild(d); scroll_(); }
function scroll_(){ window.scrollTo(0,document.body.scrollHeight); }

function chips(){
  const d=document.createElement('div'); d.className='msg';
  d.innerHTML='<div class="av">🦈</div><div style="flex:1"><div class="bub">Escríbeme una pregunta o toca un ejemplo 👇</div><div class="chips" id="chips"></div></div>';
  chat.appendChild(d);
  const ej=['¿Qué partido tiene más valor hoy?','¿Cuántos goles esperas en el primer partido?','¿Me recomiendas algún Over hoy?'];
  const c=d.querySelector('#chips');
  ej.forEach(t=>{ const b=document.createElement('span'); b.className='chip'; b.textContent=t; b.onclick=()=>{document.getElementById('q').value=t; enviar();}; c.appendChild(b); });
  scroll_();
}

function upsell(motivo){
  bloqueado=true;
  const d=document.createElement('div'); d.className='upsell';
  d.innerHTML=`<div style="font-size:14px;line-height:1.6">${esc(motivo)}</div>
    <a class="btn-vip" href="registro.html?plan=vip&next=pago">DESBLOQUEAR MAKO CON PRO →</a>`;
  chat.appendChild(d); scroll_();
  document.getElementById('sendBtn').disabled=true;
}

function pintaCreditos(e){
  const el=document.getElementById('credits');
  if(e.plan==='vip'||e.plan==='admin') el.textContent='⚡ '+e.restantes+' hoy';
  else el.textContent='🎁 '+e.restantes+' gratis';
}

async function estado(){
  const r=await fetch(`${API}/mako/estado`,{headers:{'Authorization':'Bearer '+token}});
  if(r.status===401||r.status===403){ throw new Error('401'); }
  return r.json();
}

async function enviar(){
  if(bloqueado) return;
  const ta=document.getElementById('q'); const q=ta.value.trim();
  if(!q) return;
  ta.value=''; ta.style.height='auto';
  burbuja(q,'me');
  document.getElementById('sendBtn').disabled=true;
  const t=burbuja('Mako está analizando…','mako'); t.querySelector('.bub').className='bub typing';
  try{
    const r=await fetch(`${API}/mako/preguntar`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({pregunta:q, historial:hist.slice(-10)})});
    const d=await r.json();
    t.remove();
    if(d.bloqueado){ upsell(d.motivo); return; }
    const resp=d.respuesta||'No pude responder ahora mismo.';
    burbuja(resp,'mako');
    hist.push({role:'user',content:q}); hist.push({role:'assistant',content:resp});
    if(d.aviso) aviso(d.aviso);
    pintaCreditos({plan:d.plan,restantes:d.restantes});
    document.getElementById('sendBtn').disabled=false;
  }catch(e){
    t.remove(); burbuja('Ups, no me pude conectar. Intenta de nuevo 🦈','mako');
    document.getElementById('sendBtn').disabled=false;
  }
}

// ── Init ──
(async function(){
  if(!token){
    chat.innerHTML='<div class="login-box"><div style="font-size:40px;margin-bottom:14px">🦈</div><h2 style="font-weight:800;margin-bottom:10px">Conoce a Mako</h2><p style="color:var(--t2);font-size:14px;line-height:1.6;margin-bottom:18px">Tu analista deportivo personal. Pregúntale por cualquier partido y te responde con el análisis del motor de SharpIQ.</p><a href="registro.html">Crea tu cuenta gratis</a> · <a href="login.html">Inicia sesión</a></div>';
    return;
  }
  try{
    const e=await estado();
    pintaCreditos(e);
    burbuja('¡Hola! Soy Mako 🦈, tu analista de SharpIQ. Pregúntame lo que quieras de cualquier partido de hoy: probabilidades, goles, córners, valor, a quién le ves más chances… lo que sea.','mako');
    if(!e.puede){ upsell(e.motivo); }
    else { chips(); document.getElementById('bar').style.display='block'; }
  }catch(err){
    chat.innerHTML='<div class="login-box"><div style="font-size:40px;margin-bottom:14px">🦈</div><p style="color:var(--t2);margin-bottom:16px">Tu sesión expiró. Vuelve a entrar para hablar con Mako.</p><a href="login.html">Iniciar sesión</a></div>';
  }
})();
</script>
</body>
</html>

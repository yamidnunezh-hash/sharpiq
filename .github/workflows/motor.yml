name: SharpIQ Motor

on:
  schedule:
    - cron: '0 14 * * *'    # 9:00 AM COT  (mañana)
    - cron: '0 21 * * *'    # 4:00 PM COT  (tarde)
    - cron: '30 4 * * *'    # 11:30 PM COT (resultados)
  workflow_dispatch:          # Ejecución manual desde GitHub

jobs:
  motor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install requests numpy scipy psycopg2-binary python-telegram-bot

      - name: Crear config.py desde secrets
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          ODDS_API_KEY:      ${{ secrets.ODDS_API_KEY }}
          APIFOOTBALL_KEY:   ${{ secrets.APIFOOTBALL_KEY }}
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_YAMID_ID: ${{ secrets.TELEGRAM_YAMID_ID }}
          TELEGRAM_FREE_ID:  ${{ secrets.TELEGRAM_FREE_ID }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - << 'PYEOF'
          import os
          lines = [
            f'FOOTBALL_DATA_KEY  = "{os.environ["FOOTBALL_DATA_KEY"]}"',
            f'ODDS_API_KEY       = "{os.environ["ODDS_API_KEY"]}"',
            f'APIFOOTBALL_KEY    = "{os.environ["APIFOOTBALL_KEY"]}"',
            f'TELEGRAM_TOKEN     = "{os.environ["TELEGRAM_TOKEN"]}"',
            f'TELEGRAM_YAMID_ID  = "{os.environ["TELEGRAM_YAMID_ID"]}"',
            f'TELEGRAM_FREE_ID   = "{os.environ["TELEGRAM_FREE_ID"]}"',
            f'TELEGRAM_CHAT_ID   = "{os.environ["TELEGRAM_CHAT_ID"]}"',
            'DATABASE_PUBLIC_URL = ""',
            'MP_ACCESS_TOKEN     = ""',
            'MP_PUBLIC_KEY       = ""',
            'JWT_SECRET          = ""',
          ]
          with open("sharpiq-engine/config.py", "w") as f:
              f.write("\n".join(lines) + "\n")
          print("config.py creado OK")
          PYEOF

      - name: Configurar git
        run: |
          git config user.name  "SharpIQ Motor"
          git config user.email "motor@sharpiq.co"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

      - name: Detectar turno
        id: turno
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "04" ]; then
            echo "tipo=resultados" >> $GITHUB_OUTPUT
          else
            echo "tipo=motor" >> $GITHUB_OUTPUT
          fi

      - name: Correr motor (mañana o tarde)
        if: steps.turno.outputs.tipo == 'motor'
        working-directory: sharpiq-engine
        run: |
          python auto_resultados.py 2>&1 | tail -20
          python recolector.py ayer 2>&1 | tail -20
          python motor.py           2>&1 | tail -60
          python auto_publicar.py   2>&1 | tail -20

      - name: Correr resultados (noche)
        if: steps.turno.outputs.tipo == 'resultados'
        working-directory: sharpiq-engine
        run: |
          python auto_resultados.py 2>&1 | tail -30

      - name: Commit y push final
        run: |
          git add -f predicciones.json mejor_prediccion.json datos.js 2>/dev/null || true
          git add -f sharpiq-engine/sharpiq.db 2>/dev/null || true
          git diff --cached --quiet || git commit -m "auto: predicciones $(date -u +%Y-%m-%d)"
          git pull origin main --no-rebase --quiet
          git push origin main

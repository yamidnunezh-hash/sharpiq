name: SharpIQ Motor

# Horarios en COT (UTC-5):
#   7:00 AM COT  = 12:00 UTC  → picks de mañana   (7-11 AM)
#  11:00 AM COT  = 16:00 UTC  → picks de mediodía  (11 AM-3 PM)
#   3:00 PM COT  = 20:00 UTC  → picks de tarde     (3-7 PM)
#   7:00 PM COT  = 00:00 UTC  → picks de noche     (7 PM-medianoche)

on:
  schedule:
    # Minuto :23 (NO :00) — GitHub retrasa/descarta los crons en la hora en punto
    # por congestion global. Offset recomendado por GitHub para mayor fiabilidad.
    - cron: '23 12 * * *'   # 7:23 AM COT
    - cron: '23 16 * * *'   # 11:23 AM COT
    - cron: '23 20 * * *'   # 3:23 PM COT
    - cron: '23 0 * * *'    # 7:23 PM COT (00:23 UTC siguiente)
  workflow_dispatch:
    inputs:
      hasta_hora:
        description: 'Ventana hasta hora COT (0-23)'
        default: '23'

jobs:
  motor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install requests numpy scipy psycopg2-binary python-telegram-bot

      - name: Crear config.py desde secrets
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          ODDS_API_KEY:      ${{ secrets.ODDS_API_KEY }}
          APIFOOTBALL_KEY:   ${{ secrets.APIFOOTBALL_KEY }}
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_YAMID_ID: ${{ secrets.TELEGRAM_YAMID_ID }}
          TELEGRAM_FREE_ID:  ${{ secrets.TELEGRAM_FREE_ID }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ALERTAS_ID: ${{ secrets.TELEGRAM_ALERTAS_ID }}
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: |
          python - << 'PYEOF'
          import os
          lines = [
            f'FOOTBALL_DATA_KEY  = "{os.environ["FOOTBALL_DATA_KEY"]}"',
            f'ODDS_API_KEY       = "{os.environ["ODDS_API_KEY"]}"',
            f'APIFOOTBALL_KEY    = "{os.environ["APIFOOTBALL_KEY"]}"',
            f'TELEGRAM_TOKEN     = "{os.environ["TELEGRAM_TOKEN"]}"',
            f'TELEGRAM_YAMID_ID  = "{os.environ["TELEGRAM_YAMID_ID"]}"',
            f'TELEGRAM_FREE_ID   = "{os.environ["TELEGRAM_FREE_ID"]}"',
            f'TELEGRAM_CHAT_ID   = "{os.environ["TELEGRAM_CHAT_ID"]}"',
            f'TELEGRAM_ALERTAS_ID = "{os.environ.get("TELEGRAM_ALERTAS_ID", "")}"',
            f'DATABASE_PUBLIC_URL = "{os.environ.get("DATABASE_PUBLIC_URL", "")}"',
            'MP_ACCESS_TOKEN     = ""',
            'MP_PUBLIC_KEY       = ""',
            'JWT_SECRET          = ""',
          ]
          with open("sharpiq-engine/config.py", "w") as f:
              f.write("\n".join(lines) + "\n")
          print("config.py OK")
          PYEOF

      - name: Configurar git
        run: |
          git config user.name  "SharpIQ Motor"
          git config user.email "motor@sharpiq.co"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

      - name: Detectar turno y ventana horaria
        id: turno
        run: |
          HOUR=$((10#$(date -u +%H)))   # base 10 (evita que 08/09 rompan la comparacion)
          MANUAL_HASTA="${{ github.event.inputs.hasta_hora }}"

          # Turno por RANGO de horas, NO por hora exacta. GitHub Actions retrasa los
          # crons 1-3h; con hora exacta, un run retrasado caia en 'manual' y motor.py
          # (que genera las predicciones del dia) NO corria -> el dia entero sin picks.
          if   [ "$HOUR" -ge 12 ] && [ "$HOUR" -le 15 ]; then
            echo "turno=manana"   >> $GITHUB_OUTPUT
            echo "hasta_hora=11"  >> $GITHUB_OUTPUT
            echo "label=Mañana (7-11 AM COT)" >> $GITHUB_OUTPUT
          elif [ "$HOUR" -ge 16 ] && [ "$HOUR" -le 19 ]; then
            echo "turno=mediodia" >> $GITHUB_OUTPUT
            echo "hasta_hora=15"  >> $GITHUB_OUTPUT
            echo "label=Mediodía (11 AM-3 PM COT)" >> $GITHUB_OUTPUT
          elif [ "$HOUR" -ge 20 ] && [ "$HOUR" -le 23 ]; then
            echo "turno=tarde"    >> $GITHUB_OUTPUT
            echo "hasta_hora=19"  >> $GITHUB_OUTPUT
            echo "label=Tarde (3-7 PM COT)" >> $GITHUB_OUTPUT
          elif [ "$HOUR" -ge 0 ] && [ "$HOUR" -le 4 ]; then
            echo "turno=noche"    >> $GITHUB_OUTPUT
            echo "hasta_hora=23"  >> $GITHUB_OUTPUT
            echo "label=Noche (7 PM-medianoche COT)" >> $GITHUB_OUTPUT
          else
            echo "turno=manual"   >> $GITHUB_OUTPUT
            echo "hasta_hora=${MANUAL_HASTA:-23}" >> $GITHUB_OUTPUT
            echo "label=Manual"   >> $GITHUB_OUTPUT
          fi

      - name: Log turno
        run: echo "Turno → ${{ steps.turno.outputs.label }} | Ventana hasta ${{ steps.turno.outputs.hasta_hora }}:00 COT"

      # Genera TODAS las predicciones del día. Corre en el turno mañana O en
      # cualquier disparo manual (workflow_dispatch) — asi tienes un boton de
      # recuperacion: si un dia se quedo sin picks, le das "Run workflow" y los regenera.
      - name: Generar predicciones del día
        if: steps.turno.outputs.turno == 'manana' || github.event_name == 'workflow_dispatch'
        working-directory: sharpiq-engine
        run: |
          python auto_resultados.py 2>&1 | tail -15
          python recolector.py ayer 2>&1 | tail -15
          python motor.py           2>&1 | tail -60

      # Todos los turnos: enviar picks de la ventana horaria correspondiente
      - name: Publicar picks de la ventana
        working-directory: sharpiq-engine
        env:
          HASTA_HORA_COT: ${{ steps.turno.outputs.hasta_hora }}
        run: python auto_publicar.py 2>&1 | tail -30

      - name: Commit y push
        run: |
          git pull origin main --no-rebase --quiet || true
          git add -f predicciones.json mejor_prediccion.json datos.js props_jugadores.json 2>/dev/null || true
          git add -f sharpiq-engine/sharpiq.db 2>/dev/null || true
          git diff --cached --quiet || git commit -m "auto: predicciones $(date -u +%Y-%m-%d %H:%M UTC)"
          git push origin main || (git pull origin main --no-rebase --quiet && git push origin main)

      - name: Latido al watchdog (dead-man switch)
        if: success()
        run: |
          if [ -n "${{ secrets.HEALTHCHECK_URL }}" ]; then
            curl -fsS -m 10 --retry 3 "${{ secrets.HEALTHCHECK_URL }}" \
              && echo "Latido enviado: el motor corrio OK" \
              || echo "No se pudo enviar el latido (no critico)"
          else
            echo "HEALTHCHECK_URL no configurado todavia - sin latido"
          fi
